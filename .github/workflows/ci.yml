# CI SignFlow — réactivée le 2026-07-12 (priorité 1 du bilan produit).
# Chaque push/PR : suite backend complète (Postgres pgvector + Redis + MinIO réels,
# comme le bench dev) + frontend (tsc, eslint, build prod, Playwright sur le build).
# L'ancienne CI (en pause depuis 06-01) échouait : lint repo-wide (ruff/mypy sur du
# style legacy assumé) + TEST_DATABASE_URL absent + pas de MinIO → remplacée.
name: CI

# paths-ignore : un push purement documentaire (docs/, *.md, mémoires) ne consomme
# ni minutes ni stockage — la moitié des pushes de ce repo sont des commits de docs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16   # même image que la prod (extension vector)
        env:
          POSTGRES_USER: signflow
          POSTGRES_PASSWORD: signflow
          POSTGRES_DB: signflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signflow -d signflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      # MinIO (fork pgsty/minio, l'image officielle a quitté Docker Hub) exige une commande (`server /data`) → docker run plutôt que services
      - name: Start MinIO
        run: >
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
          pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
      # Documents multipages (§3.2) : pdftoppm requis par test_document_media
      # (la conversion PPTX/LibreOffice, trop lourde pour la CI, reste skippée).
      - name: Install poppler (PDF → pages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install backend
        working-directory: backend
        run: pip install -c constraints.txt -e ".[dev]"   # versions validées, pas les dernières publiées
      - name: Pytest (suite complète)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://signflow:signflow@localhost:5432/signflow_test
          DATABASE_URL: postgresql+asyncpg://signflow:signflow@localhost:5432/signflow_test
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_PUBLIC_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_SSE_ENABLED: 'false'
          CMS_JWT_SECRET: ci-test-secret
          # Coffre Fernet requis par le chiffrement au repos (TOTP, clés IA BYOK)
          CMS_VAULT_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: pytest -q

  players:
    name: Players (tests node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Tests du code des players (renderer, sync LAN, panneau local, frein de stockage...),
      # qui extraient et EXECUTENT les vraies fonctions des 7 surfaces. Aucune dependance npm.
      # Ils ne tournaient nulle part : 5 sur 23 etaient rouges sans que personne ne le voie
      # (issue vitrail#7). Motif entre guillemets : c'est Node qui l'etend.
      - name: node --test
        run: node --test "player-rpi/test/*.test.js"

  frontend:
    name: Frontend (tsc + eslint + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build (production)
        run: npm run build
      # Les specs mockent toute l'API (page.route) → seul le frontend est nécessaire.
      # channel 'chrome' = le Chrome préinstallé du runner ; webServer CI = npm run start.
      - name: Playwright
        run: npx playwright test
      # retention-days: 1 — le quota Actions gratuit est 0,5 Go ; des rapports de
      # ~40 Mo gardés 7 j l'ont saturé le 21/07 (compte bloqué, jobs refusés).
      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 1
