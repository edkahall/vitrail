# Engine-dependent Chromium flags for the Raspberry Pi player (read by start-player.sh).
#
# These depend on the Electron version: when the engine changes, this file changes with it.
# Re-read before every Electron start, so an edit applies at the next player restart.
#
# One flag per line, starting with "--". Lines starting with "#" are comments.
# If this file is missing or holds no valid flag, start-player.sh uses its built-in
# defaults (the same flags as below).
#
# Fixed kiosk flags (--ozone-platform=wayland, --no-sandbox, --disable-dev-shm-usage,
# --start-fullscreen) are NOT here: they stay in start-player.sh.
#
# Electron 42 on a Raspberry Pi 5: GPU compositing/raster through ANGLE on the V3D
# OpenGL ES driver. --use-gl=egl no longer exists in Electron 42.
--enable-gpu
--use-gl=angle
--use-angle=gles
--use-v4l2-codec
